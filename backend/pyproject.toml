[project]
name = "vera-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite==0.20.0", "alembic==1.14.1", "asyncpg==0.30.0", "fastapi==0.115.6", "google-genai==1.0.0",
  "pydantic-settings==2.7.1", "sqlalchemy[asyncio]==2.0.36", "uvicorn[standard]==0.34.0"
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.3.4", "pytest-asyncio==0.25.0", "ruff==0.8.4"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.3.4", "pytest-asyncio==0.25.0", "ruff==0.8.4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

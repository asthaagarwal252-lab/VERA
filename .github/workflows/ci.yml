name: Verify VERA
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: vera-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.2/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/compact" update 0.31.1
      - name: Recompile and verify committed artifacts
        run: |
          compact compile contracts/vera.compact contracts/managed/vera
          git diff --exit-code -- contracts/managed/vera
          diff -qr contracts/managed/vera/keys public/artifacts/keys
          diff -qr contracts/managed/vera/zkir public/artifacts/zkir
      - run: npm run contracts:validate
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: astral-sh/setup-uv@v5
      - run: uv venv backend/.venv
      - run: uv pip install --python backend/.venv/bin/python -e "backend[dev]"
      - run: backend/.venv/bin/python -m ruff check backend api
      - run: backend/.venv/bin/python -m pytest backend/tests
      - run: node -e "JSON.parse(require('node:fs').readFileSync('vercel.json')); console.log('vercel.json valid')"
